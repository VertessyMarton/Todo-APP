<main class="auth-page">
  <div class="auth-shell">
    <section aria-labelledby="login-title">
      <header class="auth-header">
        <h1 id="login-title">Sign in</h1>
      </header>
      <form class="auth-form" (ngSubmit)="onSignIn()">
        @if (successMessage()) {
          <p class="message success-message" role="status">{{ successMessage() }}</p>
        }
        @if (errorMessage()) {
          <p class="message error-message" role="alert">{{ errorMessage() }}</p>
        }
        <div class="form-field">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="username"
            required
            autocomplete="email"
          />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
      <p class="auth-footer">Don't have an account? <a routerLink="/register">Register</a></p>
    </section>
  </div>
</main>
